services:
  postgres:
    image: postgres:13
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: cuberbeer/kittygram_backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - static:/app/shared
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: cuberbeer/kittygram_frontend:${IMAGE_TAG:-latest}
    command: ["cp", "-a", "/app/build/.", "/static/"]
    volumes:
      - static:/static

  gateway:
    image: cuberbeer/kittygram_gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - static:/static:ro
      - media:/media:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  pg_data:
  static:
  media:
